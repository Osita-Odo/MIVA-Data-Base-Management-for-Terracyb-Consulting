# =====================================================================
# Portfolio 5: TerraCyb EAD distributed over three Nigerian sites
# (simulated on one laptop; see ../docs/site-selection.md for the siting)
#
#   pg-lagos          Lagos (headquarters): read/write PRIMARY; loads the
#                     Portfolio 1 schema and data
#   pg-portharcourt   Port Harcourt: streaming hot-standby REPLICA of Lagos
#                     for disaster recovery (separate subsea route, 448 km away)
#   pg-abuja          Abuja: holds public-sector clients' findings
#                     (geo-partition reached from Lagos via postgres_fdw)
#   mongo-lagos, mongo-portharcourt, mongo-abuja
#                     MongoDB replica set rs0: one member per site, so the
#                     loss of any ONE site still leaves a majority (2 of 3)
#   mongo-init        One-shot container that initiates the replica set
#
#   docker compose up -d     (first start takes about a minute: seed load + base backup)
#   docker compose ps
# =====================================================================
x-pg-common: &pg-common
  image: postgres:16
  environment: &pg-env
    POSTGRES_PASSWORD: terracyb-demo        # demo only; never commit real passwords
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
    interval: 5s
    timeout: 3s
    retries: 30

services:
  pg-lagos:
    <<: *pg-common
    container_name: pg-lagos
    environment:
      <<: *pg-env
      POSTGRES_DB: ead
    # Settings a primary needs to stream WAL to a standby
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=10
        -c max_replication_slots=10
        -c hot_standby=on
        -c wal_keep_size=256MB
    ports:
      - "5432:5432"
    volumes:
      - pg-lagos-data:/var/lib/postgresql/data
      # Scripts in docker-entrypoint-initdb.d run once, in name order, on first start
      - ./config/primary-init.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
      - ../portfolio-1-database-design/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ../portfolio-1-database-design/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
      - ./sql:/sql:ro

  pg-portharcourt:
    <<: *pg-common
    container_name: pg-portharcourt
    user: postgres
    environment:
      PGPASSWORD: replicator-demo
      PRIMARY_HOST: pg-lagos
    command: ["bash", "/config/replica-entrypoint.sh"]
    depends_on:
      pg-lagos:
        condition: service_healthy            # wait until the primary accepts connections
    ports:
      - "5433:5432"
    volumes:
      - pg-portharcourt-data:/var/lib/postgresql/data
      - ./config:/config:ro
      - ./sql:/sql:ro

  pg-abuja:
    <<: *pg-common
    container_name: pg-abuja
    environment:
      <<: *pg-env
      POSTGRES_DB: ead_abuja
    ports:
      - "5434:5432"
    volumes:
      - pg-abuja-data:/var/lib/postgresql/data
      - ./sql/abuja_node_init.sql:/docker-entrypoint-initdb.d/01-abuja.sql:ro
      - ./sql:/sql:ro

  mongo-lagos: &mongo
    image: mongo:7.0
    container_name: mongo-lagos
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-lagos-data:/data/db
      - ./mongo:/scripts:ro
  mongo-portharcourt:
    <<: *mongo
    container_name: mongo-portharcourt
    volumes:
      - mongo-portharcourt-data:/data/db
      - ./mongo:/scripts:ro
  mongo-abuja:
    <<: *mongo
    container_name: mongo-abuja
    volumes:
      - mongo-abuja-data:/data/db
      - ./mongo:/scripts:ro

  mongo-init:
    image: mongo:7.0
    container_name: mongo-init
    depends_on: [mongo-lagos, mongo-portharcourt, mongo-abuja]
    restart: "no"
    volumes:
      - ./mongo:/scripts:ro
    entrypoint: ["bash", "/scripts/init-replica-set.sh"]

volumes:
  pg-lagos-data:
  pg-portharcourt-data:
  pg-abuja-data:
  mongo-lagos-data:
  mongo-portharcourt-data:
  mongo-abuja-data:
